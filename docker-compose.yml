services:
  # for development purposes
  dev:
    build: .
    volumes:
      - ./:/code
      - ./data:/data
    environment:
      - KBC_DATADIR=./data
  test:
    # Deviation from the template's build_n_test.sh (this repo has none): the multi-stage Dockerfile's
    # test stage runs ruff at image build; this service builds that stage and runs its CMD.
    build:
      context: .
      target: test
    volumes:
      - ./:/code
      - ./data:/data
    environment:
      - KBC_DATADIR=./data
    command: ["uv", "run", "pytest", "tests/", "-v"]
