[project]
name = "ex-azure-service-bus"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    # capped <7.15: 7.15.0 removes uamqp_transport; this component is pyamqp-only (spec §3.1).
    "azure-servicebus>=7.14.3,<7.15",
    "azure-identity>=1.19,<2",
    # >=1.11: manifest write_always + has_header support as read in 1.11.0 (spec §6.9).
    "keboola-component>=1.11",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "keboola.datadirtest>=2.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.16.0",
    "ty>=0.0.24",
]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
